name: F407 CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
      - name: Configure host tests
        run: cmake -S . -B build/host -G Ninja -DPNX_HOST_TESTS=ON
      - name: Build host tests
        run: cmake --build build/host --parallel
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure

  f407-builds:
    runs-on: ubuntu-24.04
    strategy:
      # One job per configure preset. Keep this list equal to the preset list in
      # CMakePresets.json: a preset that no job builds is a preset that silently
      # rots. If you add a preset, add it here.
      fail-fast: false
      matrix:
        preset:
          - f407-debug             # Core, product baseline
          - f407-release           # Core, release flags
          - f407-usb-cdc-debug     # Core + USB CDC, product optional
          - f407-usb-cdc-release   # Core + USB CDC, release flags
          - f407-pwm-a2-debug      # validation closure, not a product image
    name: build ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
      - name: Install GNU Arm toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-none-eabi ninja-build
      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }} --parallel
